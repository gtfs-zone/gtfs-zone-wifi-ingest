[project]
name = "gtfs-zone-wifi-ingest"
version = "0.0.0"
requires-python = ">=3.13"
description = "Upload service for wifi.gtfs.zone session data"
license = "AGPL-3.0-or-later"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.25",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]

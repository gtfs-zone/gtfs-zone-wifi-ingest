publiccodeYmlVersion: "0.4"

name: GTFS.zone Wifi Ingest
url: "https://github.com/gtfs-zone/gtfs-zone-wifi-ingest"

platforms:
  - linux

categories:
  - data-collection

developmentStatus: concept

softwareType: "standalone/backend"

description:
  en:
    shortDescription: >
      Accepts anonymous wifi and connectivity session uploads for wifi.gtfs.zone.
    longDescription: >
      GTFS.zone Wifi Ingest is the upload endpoint for the wifi.gtfs.zone
      collector app. It validates each session against a versioned JSON
      schema, rate-limits clients without storing their addresses, and writes
      the raw sessions to object storage for processing.
    features:
      - Anonymous session upload
      - Versioned session JSON schema
      - Raw session storage in S3-compatible object storage

